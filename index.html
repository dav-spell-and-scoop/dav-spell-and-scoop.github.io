<!doctype html>
<html lang="th">

      content="มาซื้อไอศกรีมในราคาเพียง 1 วีร์กันเถอะ !"

    <style>
      :root {
        --ink: #f1dcd0;
        --wine: #6e2326;
        --g1: #ffd21f;
        --g2: #ff9f3a;
        --white: #fffdf7;
        --black: #141010;
        --gold: #e6c36a;
        --dark: #2a1a18;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      body,
      html {
        margin: 0;
        height: 100%;
        background: #12070b;
        font-family: var(--f, Sarabun), system-ui, sans-serif;
        color: var(--ink);
        overflow: hidden;
        touch-action: manipulation;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #12070b;
      }
      #stage {
        --sw: min(
          calc(100vw - 16px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)),
          calc(
            (100vh - 16px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) *
              0.6918
          ),
          620px
        );
        position: relative;
        width: var(--sw);
        aspect-ratio: 604/873;
      }
      @supports (height: 100dvh) {
        #stage {
          --sw: min(
            calc(100vw - 16px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)),
            calc(
              (100dvh - 16px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) *
                0.6918
            ),
            620px
          );
        }
      }
      #stage {
        overflow: hidden;
        border-radius: calc(var(--sw) * 0.07);
        background: #12070b;
      }
      #stage::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        border-radius: calc(var(--sw) * 0.07);
        border: calc(var(--sw) * 0.016) solid #fffdf7;
        box-shadow:
          inset 0 0 0 calc(var(--sw) * 0.006) #141010,
          0 0 0 calc(var(--sw) * 0.006) #141010;
      }
      #stage {
        background: radial-gradient(ellipse at 50% 35%, #5a2236 0%, #2e0f1b 60%, #1a0a10 100%);
      }
      svg#sv {
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      svg#sv.rdy {
        opacity: 1;
      }
      #seal,
      #bar {
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      #stage.rdy #seal,
      #stage.rdy #bar {
        opacity: 1;
      }
      svg#sv {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .sp {
        transform-box: fill-box;
        transform-origin: center;
        animation: tw 2.4s infinite ease-in-out;
      }
      @keyframes tw {
        0%,
        100% {
          opacity: 0.1;
          transform: scale(0.3);
        }
        50% {
          opacity: 1;
          transform: scale(1) rotate(25deg);
        }
      }
      #seal {
        position: absolute;
        top: 8%;
        left: 50%;
        transform: translateX(-50%);
        width: calc(var(--sw) * 0.17);
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        filter: drop-shadow(2px 4px 0 rgba(0, 0, 0, 0.45));
      }
      #seal svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #left {
        position: relative;
        z-index: 1;
        font:
          italic 700 calc(var(--sw) * 0.085)/1 "Playfair Display",
          Georgia,
          serif;
        font-feature-settings: "lnum" 1;
        padding: 0 3px 3px;
        background: linear-gradient(#fff3bf, #e0b24a 52%, #9a6b1c);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 1.2px 0 #3a0710) drop-shadow(0 -0.6px 0 rgba(255, 240, 190, 0.45));
      }
      #left.pop {
        animation: pop 0.4s ease-out;
      }
      @keyframes pop {
        0% {
          transform: scale(1.4);
        }
        100% {
          transform: scale(1);
        }
      }
      #msg {
        position: absolute;
        top: 30%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: var(--dark);
        font-weight: 700;
        width: max-content;
        max-width: 88%;
        text-align: center;
        white-space: normal;
        padding: 7px 18px;
        border: 3px solid transparent;
        border-radius: 20px;
        background:
          linear-gradient(#fff, #fff) padding-box,
          linear-gradient(135deg, var(--g1), var(--g2)) border-box;
        box-shadow: 3px 4px 0 rgba(0, 0, 0, 0.45);
        opacity: 0;
        transition: opacity 0.15s;
        pointer-events: none;
      }
      #msg.on {
        opacity: 1;
      }
      #ov {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: rgba(20, 8, 10, 0.72);
        padding: 16px;
        z-index: 5;
      }
      #ov[hidden],
      [hidden] {
        display: none !important;
      }
      .frame {
        width: min(100%, 350px);
        max-height: 80vh;
        max-height: 80dvh;
        overflow: auto;
        padding: 14px;
        border-radius: 22px;
        background: linear-gradient(135deg, #231a1c, var(--wine));
        box-shadow: 5px 7px 0 rgba(0, 0, 0, 0.5);
      }
      .sheet {
        padding: 18px 14px;
        text-align: center;
        color: var(--dark);
        border: 5px solid transparent;
        border-radius: 26px;
        background:
          linear-gradient(#fff, #fff) padding-box,
          linear-gradient(135deg, var(--g1), var(--g2)) border-box;
      }
      #res {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        width: 100%;
      }
      #rf {
        --w: min(92vw, 520px);
        position: relative;
        width: var(--w);
        min-height: calc(var(--w) * 0.85);
        max-height: none;
        overflow: visible;
        display: flex;
        border-radius: 6px;
        box-shadow:
          0 0 0 5px #fff,
          6px 9px 0 5px rgba(0, 0, 0, 0.4);
      }
      #rf .sheet {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 14px 12px;
      }
      .logo {
        display: block;
        max-width: 75%;
        max-height: 90px;
        margin: 0 auto 10px;
      }
      .sheet h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.2;
        color: #8a1c2b;
      }
      .sheet p {
        margin: 0 0 14px;
        line-height: 1.5;
      }
      p:empty {
        display: none;
      }
      #nm {
        width: 100%;
        font: inherit;
        font-size: 18px;
        text-align: center;
        color: var(--dark);
        background: #fff8ea;
        border: 2px solid #f3b13a;
        border-radius: 14px;
        padding: 10px;
        margin-bottom: 14px;
        -webkit-user-select: text;
        user-select: text;
      }
      button {
        font: inherit;
        font-weight: 700;
        font-size: 20px;
        color: #3a1410;
        background: linear-gradient(135deg, var(--g1), var(--g2));
        border: 3px solid var(--white);
        outline: 1.5px solid var(--black);
        border-radius: 999px;
        padding: 11px 26px;
        box-shadow: 3px 4px 0 rgba(0, 0, 0, 0.5);
      }
      button:active {
        transform: translateY(2px);
      }
      button:disabled {
        opacity: 0.45;
      }
      #rg {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-right: 34%;
        margin-bottom: 8px;
      }
      #rg svg.stk {
        display: block;
        height: calc(var(--w) * 0.5);
        width: auto;
        max-width: 100%;
      }
      .it {
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 13px;
      }
      .it img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        -webkit-user-drag: none;
      }
      .it.ph {
        border: 1px dashed #d8b98a;
        border-radius: 12px;
        padding: 4px;
        color: #8a6a4a;
      }
      #rt {
        width: 60%;
        align-self: flex-start;
        font-size: 17px;
        line-height: 1.55;
        font-weight: 600;
        text-align: center;
      }
      #rt .l2 {
        font-weight: 400;
      }
      #rv {
        position: absolute;
        right: 3%;
        bottom: 3%;
        width: 36%;
        height: 52%;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        pointer-events: none;
      }
      #rv img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        -webkit-user-drag: none;
      }
      #rv .ph {
        width: 100%;
        border: 1px dashed #d8b98a;
        border-radius: 12px;
        padding: 6px;
        font-size: 12px;
        line-height: 1.3;
        color: #8a6a4a;
        text-align: center;
        background: rgba(255, 255, 255, 0.7);
      }
      .bub {
        position: absolute;
        right: 0;
        bottom: calc(100% - 2px);
        width: 130px;
        transform-origin: 25% 100%;
        animation: bp 0.35s ease-out;
      }
      .bub svg {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(2px 3px 0 rgba(0, 0, 0, 0.4));
      }
      .bub span {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 81%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.25;
        color: #6e2326;
      }
      @keyframes bp {
        0% {
          transform: scale(0.3);
          opacity: 0;
        }
        60% {
          transform: scale(1.1);
          opacity: 1;
        }
        100% {
          transform: scale(1);
        }
      }
      #rv img.hop {
        animation: hop 0.45s ease-out;
      }
      @keyframes hop {
        30% {
          transform: translateY(-10px);
        }
        60% {
          transform: translateY(0);
        }
        80% {
          transform: translateY(-4px);
        }
        100% {
          transform: translateY(0);
        }
      }
      .rb {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }
      #b3 {
        position: relative;
        font-size: 24px;
        padding: 13px 40px;
      }
      #b3::after,
      #b3::before {
        content: "\2726";
        position: absolute;
        color: #ffe27a;
        text-shadow: 0 0 4px #fff, 1px 1px 0 #a5671b, -1px -1px 0 #a5671b;
        line-height: 1;
        pointer-events: none;
        animation: tw 1.6s ease-in-out infinite;
      }
      #b3::after {
        top: -12px;
        right: 4px;
        font-size: 26px;
      }
      #b3::before {
        top: -5px;
        right: 30px;
        font-size: 13px;
        animation-delay: 0.6s;
      }
      @keyframes tw {
        50% {
          transform: scale(0.7) rotate(20deg);
          opacity: 0.7;
        }
      }
      button.alt {
        background: #fff;
        color: var(--dark);
        border-color: #f3b13a;
        outline: 0;
      }
      #fg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      button.fl {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 10px 6px;
        font-size: 15px;
        color: var(--dark);
        background: #fff8ea;
        border: 3px solid #f3b13a;
        outline: 0;
        border-radius: 18px;
        box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.3);
      }
      button.fl .sw,
      button.fl img {
        width: 68px;
        height: 58px;
        object-fit: contain;
      }
      button.fl .sw {
        border: 1px dashed #d8b98a;
        border-radius: 50%;
      }
      #bar {
        position: absolute;
        left: 4%;
        bottom: 3.5%;
        pointer-events: none;
      }
      #ok {
        pointer-events: auto;
        width: calc(var(--sw) * 0.27);
        height: calc(var(--sw) * 0.27);
        border-radius: 50%;
        padding: 0;
        font-size: calc(var(--sw) * 0.09);
        letter-spacing: 1px;
        border-width: 5px;
        outline-width: 2px;
        box-shadow:
          0 0 0 calc(var(--sw) * 0.016) rgba(255, 170, 50, 0.35),
          0 6px 0 #a85a12;
        animation: pl 1.2s infinite;
      }
      #ok:active {
        transform: translateY(5px);
      }
      #ok.off {
        animation: none;
        opacity: 0.45;
        filter: grayscale(0.5);
      }
      @keyframes pl {
        50% {
          box-shadow:
            0 0 0 calc(var(--sw) * 0.026) rgba(255, 170, 50, 0.18),
            0 6px 0 #a85a12;
        }
      }
      #stage.ls {
        --sh: min(
          calc(100vh - 16px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)),
          calc(
            (100vw - 16px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)) /
              var(--ar)
          ),
          900px
        );
        --sw: calc(var(--sh) * 0.6918);
        width: calc(var(--sh) * var(--ar));
        height: var(--sh);
        aspect-ratio: auto;
      }
      @supports (height: 100dvh) {
        #stage.ls {
          --sh: min(
            calc(100dvh - 16px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)),
            calc(
              (100vw - 16px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)) /
                var(--ar)
            ),
            900px
          );
        }
      }
      #stage.ls #bar {
        left: calc(50% - var(--sw) / 2 + var(--sw) * 0.04);
      }
      @media (orientation: landscape) {
        #rf {
          --w: min(92vw, 520px, max(300px, calc((100vh - 240px) / 0.85)));
        }
      }
    </style>
  </head>

      <div id="stage">
        <svg id="sv" viewBox="0 0 360 520" preserveAspectRatio="xMidYMid slice"></svg>
        <div id="seal">
          <svg viewBox="-42 -42 84 84" aria-hidden="true">
            <defs>
              <radialGradient id="wx" cx=".35" cy=".3" r=".8">
                <stop offset="0" stop-color="#c4182f" />
                <stop offset=".6" stop-color="#8f0f23" />
                <stop offset="1" stop-color="#520812" />
              </radialGradient>

              fill="none"
              stroke="#141010"
              stroke-width="7"
              stroke-linejoin="round"
