    <style>
      :root {
        --ink: #f1dcd0;
        --wine: #6e2326;
        --g1: #ffd21f;
        --g2: #ff9f3a;
        --white: #fffdf7;
        --black: #141010;
        --gold: #e6c36a;
        --dark: #2a1a18;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      body,
      html {
        margin: 0;
        height: 100%;
        background: #12070b;
        font-family: var(--f, Sarabun), system-ui, sans-serif;
        color: var(--ink);
        overflow: hidden;
        touch-action: manipulation;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #12070b;
      }
      #stage {
        --sw: min(
          calc(100vw - 16px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)),
          calc(
            (100vh - 16px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) *
              0.6918
          ),
          620px
        );
        position: relative;
        width: var(--sw);
        aspect-ratio: 604/873;
      }
      @supports (height: 100dvh) {
        #stage {
          --sw: min(
            calc(100vw - 16px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)),
            calc(
              (100dvh - 16px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) *
                0.6918
            ),
            620px
          );
        }
      }
      #stage {
        overflow: hidden;
        border-radius: calc(var(--sw) * 0.07);
        background: #12070b;
      }
      #stage::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        border-radius: calc(var(--sw) * 0.07);
        border: calc(var(--sw) * 0.016) solid #fffdf7;
        box-shadow:
          inset 0 0 0 calc(var(--sw) * 0.006) #141010,
          0 0 0 calc(var(--sw) * 0.006) #141010;
      }
      #stage {
        background: radial-gradient(ellipse at 50% 35%, #5a2236 0%, #2e0f1b 60%, #1a0a10 100%);
      }
      svg#sv {
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      svg#sv.rdy {
        opacity: 1;
      }
      #seal,
      #bar {
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      #stage.rdy #seal,
      #stage.rdy #bar {
        opacity: 1;
      }
      svg#sv {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .sp {
        transform-box: fill-box;
        transform-origin: center;
        animation: tw 2.4s infinite ease-in-out;
      }
      @keyframes tw {
        0%,
        100% {
          opacity: 0.1;
          transform: scale(0.3);
        }
        50% {
          opacity: 1;
          transform: scale(1) rotate(25deg);
        }
      }
      #seal {
        position: absolute;
        top: 8%;
        left: 50%;
        transform: translateX(-50%);
        width: calc(var(--sw) * 0.17);
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        filter: drop-shadow(2px 4px 0 rgba(0, 0, 0, 0.45));
      }
      #seal svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #left {
        position: relative;
        z-index: 1;
        font:
          italic 700 calc(var(--sw) * 0.085)/1 "Playfair Display",
          Georgia,
          serif;
        font-feature-settings: "lnum" 1;
        padding: 0 3px 3px;
        background: linear-gradient(#fff3bf, #e0b24a 52%, #9a6b1c);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 1.2px 0 #3a0710) drop-shadow(0 -0.6px 0 rgba(255, 240, 190, 0.45));
      }
      #left.pop {
        animation: pop 0.4s ease-out;
      }
      @keyframes pop {
        0% {
          transform: scale(1.4);
        }
        100% {
          transform: scale(1);
        }
      }
      #msg {
        position: absolute;
        top: 30%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: var(--dark);
        font-weight: 700;
        width: max-content;
        max-width: 88%;
        text-align: center;
        white-space: normal;
        padding: 7px 18px;
        border: 3px solid transparent;
        border-radius: 20px;
        background:
          linear-gradient(#fff, #fff) padding-box,
          linear-gradient(135deg, var(--g1), var(--g2)) border-box;
        box-shadow: 3px 4px 0 rgba(0, 0, 0, 0.45);
        opacity: 0;
        transition: opacity 0.15s;
        pointer-events: none;
      }
      #msg.on {
        opacity: 1;
      }
      #ov {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: rgba(20, 8, 10, 0.72);
        padding: 16px;
        z-index: 5;
      }
      #ov[hidden],
      [hidden] {
        display: none !important;
      }
      .frame {
        width: min(100%, 350px);
        max-height: 80vh;
        max-height: 80dvh;
        overflow: auto;
        padding: 14px;
        border-radius: 22px;
        background: linear-gradient(135deg, #231a1c, var(--wine));
        box-shadow: 5px 7px 0 rgba(0, 0, 0, 0.5);
      }
      .sheet {
        padding: 18px 14px;
        text-align: center;
        color: var(--dark);
        border: 5px solid transparent;
        border-radius: 26px;
        background:
          linear-gradient(#fff, #fff) padding-box,
          linear-gradient(135deg, var(--g1), var(--g2)) border-box;
      }
      #res {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        width: 100%;
      }
      #rf {
        --w: min(92vw, 520px);
        position: relative;
        width: var(--w);
        min-height: calc(var(--w) * 0.85);
        max-height: none;
        overflow: visible;
        display: flex;
        border-radius: 6px;
        box-shadow:
          0 0 0 5px #fff,
          6px 9px 0 5px rgba(0, 0, 0, 0.4);
      }
      #rf .sheet {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 14px 12px;
      }
      .logo {
        display: block;
        width: 100%;
        max-width: 100%;
        height: auto;
        max-height: 170px;
        object-fit: contain;
        margin: 0 auto 12px;
      }
      .sheet h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.2;
        color: #8a1c2b;
      }
      .sheet p {
        margin: 0 0 14px;
        line-height: 1.5;
      }
      p:empty {
        display: none;
      }
      #nm {
        width: 100%;
        font: inherit;
        font-size: 18px;
        text-align: center;
        color: var(--dark);
        background: #fff8ea;
        border: 2px solid #f3b13a;
        border-radius: 14px;
        padding: 10px;
        margin-bottom: 14px;
        -webkit-user-select: text;
        user-select: text;
      }
      button {
        font: inherit;
        font-weight: 700;
        font-size: 20px;
        color: #3a1410;
        background: linear-gradient(135deg, var(--g1), var(--g2));
        border: 3px solid var(--white);
        outline: 1.5px solid var(--black);
        border-radius: 999px;
        padding: 11px 26px;
        box-shadow: 3px 4px 0 rgba(0, 0, 0, 0.5);
      }
      button:active {
        transform: translateY(2px);
      }
      button:disabled {
        opacity: 0.45;
      }
      #rg {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-right: 34%;
        margin-bottom: 8px;
      }
      #rg svg.stk {
        display: block;
        height: calc(var(--w) * 0.5);
        width: auto;
        max-width: 100%;
      }
      .it {
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 13px;
      }
      .it img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        -webkit-user-drag: none;
      }
      .it.ph {
        border: 1px dashed #d8b98a;
        border-radius: 12px;
        padding: 4px;
        color: #8a6a4a;
      }
      #rt {
        width: 60%;
        align-self: flex-start;
        font-size: 17px;
        line-height: 1.55;
        font-weight: 600;
        text-align: center;
      }
      #rt .l2 {
        font-weight: 400;
      }
      #rv {
        position: absolute;
        right: 3%;
        bottom: 3%;
        width: 36%;
        height: 52%;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        pointer-events: none;
      }
      #rv img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        -webkit-user-drag: none;
      }
      #rv .ph {
        width: 100%;
        border: 1px dashed #d8b98a;
        border-radius: 12px;
        padding: 6px;
        font-size: 12px;
        line-height: 1.3;
        color: #8a6a4a;
        text-align: center;
        background: rgba(255, 255, 255, 0.7);
      }
      #rlg {
        position: absolute;
        right: 4%;
        top: 3%;
        width: 34%;
        height: 17%;
        object-fit: contain;
        object-position: center;
        pointer-events: none;
        z-index: 2;
        -webkit-user-drag: none;
      }
      .bub {
        position: absolute;
        right: 0;
        bottom: calc(100% - 2px);
        width: 130px;
        transform-origin: 25% 100%;
        animation: bp 0.35s ease-out;
      }
      .bub svg {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(2px 3px 0 rgba(0, 0, 0, 0.4));
      }
      .bub span {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 81%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.25;
        color: #6e2326;
      }
      @keyframes bp {
        0% {
          transform: scale(0.3);
          opacity: 0;
        }
        60% {
          transform: scale(1.1);
          opacity: 1;
        }
        100% {
          transform: scale(1);
        }
      }
      #rv img.hop {
        animation: hop 0.45s ease-out;
      }
      @keyframes hop {
        30% {
          transform: translateY(-10px);
        }
        60% {
          transform: translateY(0);
        }
        80% {
          transform: translateY(-4px);
        }
        100% {
          transform: translateY(0);
        }
      }
      .rb {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }
      #b3 {
        position: relative;
        font-size: 24px;
        padding: 13px 40px;
      }
      #b3::after,
      #b3::before {
        content: "";
        position: absolute;
        background: url(img/star_gold.PNG) center / contain no-repeat;
        pointer-events: none;
        animation: btw 1.6s ease-in-out infinite;
      }
      #b3::after {
        top: -18px;
        right: -6px;
        width: 38px;
        height: 38px;
      }
      #b3::before {
        top: -8px;
        right: 30px;
        width: 20px;
        height: 20px;
        animation-delay: 0.6s;
      }
      #seal::after,
      .gn::before,
      .gn::after,
      #pick h1::before,
      #pick h1::after {
        content: "";
        background: url(img/star_gold.PNG) center / contain no-repeat;
        animation: btw 2.4s ease-in-out infinite;
      }
      #seal::after {
        position: absolute;
        top: -26%;
        right: -34%;
        width: 62%;
        aspect-ratio: 1;
      }
      .sheet .gn {
        display: table;
        position: relative;
        margin: 0 auto 12px;
      }
      .gn::before,
      .gn::after {
        position: absolute;
        width: 1.05em;
        height: 1.05em;
      }
      .gn::before {
        left: -0.7em;
        top: -0.45em;
      }
      .gn::after {
        right: -0.65em;
        bottom: -0.3em;
      }
      #pick h1::before,
      #pick h1::after {
        display: inline-block;
        width: 0.8em;
        height: 0.8em;
        vertical-align: -0.1em;
        margin: 0 0.3em;
      }
      .gn::after,
      #pick h1::after {
        animation-delay: 1.1s;
      }
      .gt {
        transform-box: fill-box;
        transform-origin: center;
        animation: gtw 3.2s ease-in-out infinite;
        animation-delay: var(--dl, 0s);
        filter: drop-shadow(0 0 2px rgba(255, 210, 90, 0.7));
      }
      .gb {
        transform-box: fill-box;
        transform-origin: center;
        pointer-events: none;
        animation: gbk 1s ease-out both;
      }
      @keyframes gtw {
        50% { opacity: 0.35; transform: scale(0.72) rotate(14deg); }
      }
      @keyframes gbk {
        0% { opacity: 0; transform: translate(0, 0) scale(0.2) rotate(0deg); }
        20% { opacity: 1; }
        100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1) rotate(70deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #b3::after, #b3::before, #seal::after, .gn::before, .gn::after,
        #pick h1::before, #pick h1::after, .gt, .gb { animation: none; }
      }
      @keyframes btw {
        50% {
          transform: scale(0.7) rotate(20deg);
          opacity: 0.7;
        }
      }
      #rf::before {
        content: "";
        position: absolute;
        inset: 6px;
        border: 1.4px dotted #e6c36a;
        border-radius: 4px;
        pointer-events: none;
      }
      .co {
        overflow: visible;
        position: absolute;
        pointer-events: none;
        animation: cotw 2.4s ease-in-out infinite;
      }
      .co.tl,
      .co.br {
        width: 40px;
        height: 40px;
      }
      .co.tr,
      .co.bl {
        width: 30px;
        height: 30px;
        animation-delay: 1s;
      }
      .co.tl {
        left: -20px;
        top: -20px;
      }
      .co.tr {
        right: -15px;
        top: -15px;
      }
      .co.bl {
        left: -15px;
        bottom: -15px;
      }
      .co.br {
        right: -20px;
        bottom: -20px;
      }
      @keyframes cotw {
        50% {
          transform: scale(0.82) rotate(12deg);
          opacity: 0.8;
        }
      }
      .stk .drop {
        animation: drp 0.75s both;
      }
      @keyframes drp {
        0% {
          transform: translateY(-190px);
          opacity: 0;
          animation-timing-function: cubic-bezier(0.55, 0, 0.9, 0.6);
        }
        10% {
          opacity: 1;
        }
        62% {
          transform: translateY(0);
          animation-timing-function: ease-out;
        }
        78% {
          transform: translateY(-10px);
          animation-timing-function: ease-in;
        }
        100% {
          transform: translateY(0);
        }
      }
      .ds {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: dsf linear infinite;
      }
      @keyframes dsf {
        0% {
          opacity: 0;
          transform: translate(0, 0) rotate(0);
        }
        15% {
          opacity: 0.85;
        }
        70% {
          opacity: 0.6;
        }
        100% {
          opacity: 0;
          transform: translate(var(--dx), var(--dy)) rotate(60deg);
        }
      }
      .swL,
      .swR {
        transform-box: fill-box;
        animation: sw 6.5s ease-in-out infinite alternate;
      }
      .swL {
        transform-origin: 0 0;
        --k: -0.6deg;
      }
      .swR {
        transform-origin: 100% 0;
        --k: 0.6deg;
        animation-delay: -2.2s;
      }
      @keyframes sw {
        from {
          transform: scaleX(1) skewX(0deg);
        }
        to {
          transform: scaleX(1.022) skewX(var(--k));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ds,
        .swL,
        .swR,
        .co,
        .stk .drop {
          animation: none;
        }
      }
      .cast path {
        fill: none;
        stroke: var(--ink, #ffe9a8);
        stroke-width: 1.1;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        opacity: 0;
        transform-box: fill-box;
        transform-origin: 50% 50%;
      }
      .cast.on path {
        animation: cast 2.3s ease-out forwards;
      }
      @keyframes cast {
        0% {
          opacity: 0;
          stroke-dashoffset: 1;
          transform: rotate(-25deg) scale(0.9);
        }
        8% {
          opacity: 1;
        }
        45% {
          stroke-dashoffset: 0;
          transform: rotate(0) scale(1);
        }
        62% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          stroke-dashoffset: 0;
          transform: rotate(30deg) scale(1.1);
        }
      }
      #rf .sheet {
        position: relative;
      }
      #rf .sheet > #rg,
      #rf .sheet > #rt {
        position: relative;
        z-index: 1;
      }
      .wm {
        position: absolute;
        z-index: 0;
        left: calc(12px + (100% - 24px) * 0.33);
        top: 40%;
        width: calc(var(--w) * 0.56);
        height: calc(var(--w) * 0.56);
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      .mg {
        position: absolute;
        z-index: 0;
        left: calc(12px + (100% - 24px) * 0.33);
        top: 40%;
        width: calc(var(--w) * 0.54);
        height: calc(var(--w) * 0.54);
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      .mg.t2 { width: calc(var(--w) * 0.57); height: calc(var(--w) * 0.57); }
      .mg.t3, .mg.t4 { width: calc(var(--w) * 0.6); height: calc(var(--w) * 0.6); }
      .mg .mc {
        position: absolute;
        inset: 0;
        background: rgba(110, 35, 38, 0.55);
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        animation: mgf 1.4s ease both, mgr 120s linear infinite;
      }
      .mg .gs {
        position: absolute;
        height: auto;
        transform: translate(-50%, -50%);
        filter: drop-shadow(0 0 3px rgba(230, 180, 70, 0.6));
        animation: mgt 2.6s ease-in-out infinite;
      }
      .mg .pt {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #d9a93a;
        opacity: 0;
        animation: mgp 3.6s ease-in infinite;
      }
      .mg .fl {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 150%;
        height: auto;
        opacity: 0;
        transform: translate(-50%, -50%);
        animation: mgb 1.5s ease-out both;
        animation-delay: var(--d);
      }
      @keyframes mgf { from { opacity: 0; } }
      @keyframes mgr { to { transform: rotate(360deg); } }
      @keyframes mgt {
        50% { opacity: 0.55; transform: translate(-50%, -50%) scale(0.8) rotate(12deg); }
      }
      @keyframes mgp {
        0% { opacity: 0; transform: translateY(0); }
        20% { opacity: 0.9; }
        100% { opacity: 0; transform: translateY(-70px); }
      }
      @keyframes mgb {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2) rotate(-25deg); }
        30% { opacity: 1; }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .mg .mc, .mg .gs, .mg .pt, .mg .fl { animation: none; }
      }
      .wm path {
        fill: none;
        stroke: rgba(110, 35, 38, 0.3);
        stroke-width: 0.9;
        stroke-linecap: round;
      }
      .wmr {
        animation: wmr 90s linear infinite;
      }
      @keyframes wmr {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .cast.on path,
        .wmr {
          animation: none;
        }
      }
      button.alt {
        background: #fff;
        color: var(--dark);
        border-color: #f3b13a;
        outline: 0;
      }
      #fg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      button.fl {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 10px 6px;
        font-size: 15px;
        color: var(--dark);
        background: #fff8ea;
        border: 3px solid #f3b13a;
        outline: 0;
        border-radius: 18px;
        box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.3);
      }
      button.fl .sw,
      button.fl img {
        width: 68px;
        height: 58px;
        object-fit: contain;
      }
      button.fl .sw {
        border: 1px dashed #d8b98a;
        border-radius: 50%;
      }
      #bar {
        position: absolute;
        left: 4%;
        bottom: 3.5%;
        pointer-events: none;
      }
      #ok {
        pointer-events: auto;
        width: calc(var(--sw) * 0.27);
        height: calc(var(--sw) * 0.27);
        border-radius: 50%;
        padding: 0;
        font-size: calc(var(--sw) * 0.09);
        letter-spacing: 1px;
        border-width: 5px;
        outline-width: 2px;
        box-shadow:
          0 0 0 calc(var(--sw) * 0.016) rgba(255, 170, 50, 0.35),
          0 6px 0 #a85a12;
        animation: pl 1.2s infinite;
      }
      #ok:active {
        transform: translateY(5px);
      }
      #ok.off {
        animation: none;
        opacity: 0.45;
        filter: grayscale(0.5);
      }
      @keyframes pl {
        50% {
          box-shadow:
            0 0 0 calc(var(--sw) * 0.026) rgba(255, 170, 50, 0.18),
            0 6px 0 #a85a12;
        }
      }
      #stage.ls {
        --sh: min(
          calc(100vh - 16px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)),
          calc(
            (100vw - 16px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)) /
              var(--ar)
          ),
          900px
        );
        --sw: calc(var(--sh) * 0.6918);
        width: calc(var(--sh) * var(--ar));
        height: var(--sh);
        aspect-ratio: auto;
      }
      @supports (height: 100dvh) {
        #stage.ls {
          --sh: min(
            calc(100dvh - 16px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)),
            calc(
              (100vw - 16px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)) /
                var(--ar)
            ),
            900px
          );
        }
      }
      #stage.ls #bar {
        left: calc(50% - var(--sw) / 2 + var(--sw) * 0.04);
      }
      @media (orientation: landscape) {
        #rf {
          --w: min(92vw, 520px, max(300px, calc((100vh - 240px) / 0.85)));
        }
      }
    </style>
  </head>
